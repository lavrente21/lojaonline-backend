services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lumina_test
      POSTGRES_USER: lumina_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Define TEST_POSTGRES_PASSWORD apenas no ambiente local de teste}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina_test -d lumina_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - lumina_test_pgdata:/var/lib/postgresql/data
volumes:
  lumina_test_pgdata:
