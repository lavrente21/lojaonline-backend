envVarGroups:
  - name: lumina-cron-shared
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: CRON_SECRET
        sync: false
services:
  - type: web
    name: lumina-api
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ORIGENS_PERMITIDAS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: PORTES_PRAZO_HORAS
        value: "72"
      - key: PORTES_SLA_HORAS
        value: "12"
      - key: DEVOLUCAO_PRAZO_DIAS
        value: "14"
      - key: KITS_ATIVOS
        value: "false"
      - key: CJ_ENVIO_VALIDADO
        value: "false"
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ADMIN_NOME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SUPABASE_COMPROVATIVOS_BUCKET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: STORE_ORDER_NOTIFICATION_EMAIL
        sync: false
      - key: PAGAMENTO_METODOS_ATIVOS
        sync: false
      - key: PAGAMENTO_PRAZO_HORAS
        sync: false
      - key: PAGAMENTO_TITULAR
        sync: false
      - key: PAGAMENTO_BANCO
        sync: false
      - key: PAGAMENTO_IBAN
        sync: false
      - key: PAGAMENTO_SWIFT
        sync: false
      - key: PAGAMENTO_MULTICAIXA_ENTIDADE
        sync: false
      - key: PAGAMENTO_MULTICAIXA_TELEFONE
        sync: false
      - key: PAGAMENTO_INSTRUCOES_EXTRA
        sync: false
      - key: AGENTE_NOME
        sync: false
      - key: AGENTE_LINHA1
        sync: false
      - key: AGENTE_LINHA2
        sync: false
      - key: AGENTE_CIDADE
        sync: false
      - key: AGENTE_PROVINCIA
        sync: false
      - key: AGENTE_CODIGO_POSTAL
        sync: false
      - key: AGENTE_PAIS
        sync: false
      - key: AGENTE_TELEFONE
        sync: false
      - key: AGENTE_EMAIL
        sync: false
      - key: AGENTE_REFERENCIA
        sync: false
      - key: PAISES_COM_ENVIO_DIRETO
        sync: false
      - key: CJ_API_KEY
        sync: false
      - key: CJ_LOGISTIC_NAME
        sync: false
      - key: CJ_FROM_COUNTRY_CODE
        sync: false
      - key: CJ_TRACKING_WEBHOOK_SECRET
        sync: false
      - key: CJ_SYNC_MARGIN_PCT
        sync: false
      - key: BUCKYDROP_API_URL
        sync: false
      - key: BUCKYDROP_APPCODE
        sync: false
      - key: BUCKYDROP_APPSECRET
        sync: false
      - key: BUCKYDROP_FREIGHT_PATH
        sync: false
      - key: BUCKYDROP_ORDER_PATH
        sync: false
      - key: BUCKYDROP_TRACK_PATH
        sync: false
      - key: BUCKYDROP_TRACKING_WEBHOOK_SECRET
        sync: false
      - key: LUMINA_SHIPPING_RATES_JSON
        sync: false
      - key: ENVIO_AUTOMATICO_FORNECEDOR
        value: "false"
      - key: EMPRESA_DENOMINACAO
        sync: false
      - key: EMPRESA_NIF
        sync: false
      - key: EMPRESA_MORADA
        sync: false
      - key: EMPRESA_EMAIL
        sync: false
      - key: EMPRESA_TELEFONE
        sync: false
      - key: EMPRESA_REPRESENTANTE
        sync: false
      - key: EMPRESA_HORARIO
        sync: false
      - key: EMPRESA_LIVRO_RECLAMACOES
        sync: false
      - key: EMPRESA_IVA
        sync: false
  - type: cron
    name: lumina-expirar-pedidos
    runtime: node
    plan: starter
    envVarGroups:
      - lumina-cron-shared
    schedule: '*/10 * * * *'
    buildCommand: npm ci
    startCommand: npm run jobs:expirar-pedidos
    envVars:
      - key: NODE_ENV
        value: production
  - type: cron
    name: lumina-sincronizar-tracking
    runtime: node
    plan: starter
    envVarGroups:
      - lumina-cron-shared
    schedule: '*/30 * * * *'
    buildCommand: npm ci
    startCommand: npm run jobs:sync-tracking
    envVars:
      - key: NODE_ENV
        value: production
      - key: CJ_API_KEY
        sync: false
      - key: CJ_FROM_COUNTRY_CODE
        sync: false
  - type: cron
    name: lumina-lembretes-pagamento
    runtime: node
    plan: starter
    envVarGroups:
      - lumina-cron-shared
    schedule: '0 * * * *'
    buildCommand: npm ci
    startCommand: npm run jobs:lembretes-pagamento
    envVars:
      - key: NODE_ENV
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
